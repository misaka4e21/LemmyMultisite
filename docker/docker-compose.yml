x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "4"

services:
  proxy:
    image: nginx:1-alpine
    ports:
      # actual and only port facing any connection from outside
      # Note, change the left number if port 1236 is already in use on your system
      # You could use port 80 if you won't use a reverse proxy
      - "1236:1236"
      - "8536:8536"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,Z
    restart: unless-stopped
    depends_on:
      - pictrs
      - lemmy-ui
    logging: *default-logging

  lemmy:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    hostname: lemmy
    restart: unless-stopped
    environment:
      - RUST_LOG=warn,extism=info,lemmy_server=debug,lemmy_api=debug,lemmy_api_common=debug,lemmy_api_crud=debug,lemmy_apub=debug,lemmy_db_schema=debug,lemmy_db_views=debug,lemmy_routes=debug,lemmy_utils=debug,lemmy_websocket=debug,lemmy_diesel_utils=debug
      - LEMMY_DISABLE_ACTIVITY_SENDING=true
    volumes:
      - ./lemmy.hjson:/config/config.hjson:Z
      - ./plugins:/plugins:Z
    depends_on:
      postgres:
        condition: service_started
      pictrs:
        condition: service_healthy
    logging: *default-logging

  lemmy-ui:
    # use "image" to pull down an already compiled lemmy-ui. make sure to comment out "build".
    image: dessalines/lemmy-ui:nightly
    # platform: linux/x86_64 # no arm64 support. uncomment platform if using m1.
    # use "build" to build your local lemmy ui image for development. make sure to comment out "image".
    # run: docker compose up --build

    # build:
    #   context: ../../lemmy-ui # assuming lemmy-ui is cloned besides lemmy directory
    #   dockerfile: dev.dockerfile
    environment:
      # this needs to match the hostname defined in the lemmy service
      - LEMMY_UI_BACKEND=lemmy:8536
      # set the outside hostname here
      - LEMMY_UI_HTTPS=false
      - LEMMY_UI_ERUDA=true
    depends_on:
      - lemmy
    restart: unless-stopped
    logging: *default-logging
    init: true

  pictrs:
    image: asonix/pictrs:0.5
    # this needs to match the pictrs url in lemmy.hjson
    hostname: pictrs
    # we can set options to pictrs like this, here we set max. image size and forced format for conversion
    # entrypoint: /sbin/tini -- /usr/local/bin/pict-rs -p /mnt -m 4 --image-format webp
    environment:
      - PICTRS_OPENTELEMETRY_URL=http://otel:4137
      - PICTRS__SERVER__API_KEY=my-pictrs-key
      - PICTRS__STORE__TYPE=object_storage
      - PICTRS__STORE__ENDPOINT=${S3_ENDPOINT:-http://rustfs:9000}
      - PICTRS__STORE__BUCKET_NAME=${S3_BUCKET:-lemmy-media}
      - PICTRS__STORE__REGION=${S3_REGION:-us-east-1}
      - PICTRS__STORE__ACCESS_KEY=${S3_ACCESS_KEY:-lemmy-rustfs}
      - PICTRS__STORE__SECRET_KEY=${S3_SECRET_KEY:-lemmy-rustfs-secret}
      - PICTRS__STORE__USE_PATH_STYLE=${S3_USE_PATH_STYLE:-true}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://rustfs:9000}
      - S3_BUCKET=${S3_BUCKET:-lemmy-media}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-lemmy-rustfs}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-lemmy-rustfs-secret}
      - PICTRS__MEDIA__VIDEO_CODEC=vp9
      - PICTRS__MEDIA__GIF__MAX_WIDTH=256
      - PICTRS__MEDIA__GIF__MAX_HEIGHT=256
      - PICTRS__MEDIA__GIF__MAX_AREA=65536
      - PICTRS__MEDIA__GIF__MAX_FRAME_COUNT=400
    user: 991:991
    volumes:
      - ./volumes/pictrs:/mnt:Z
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  rustfs:
    # Pinned release. Use a digest in production.
    image: rustfs/rustfs:1.0.5
    hostname: rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-lemmy-rustfs}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-lemmy-rustfs-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./volumes/rustfs:/data
    restart: unless-stopped
    logging: *default-logging

  rustfs-init:
    image: amazon/aws-cli:2.40.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lemmy-rustfs}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lemmy-rustfs-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:-lemmy-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until aws --endpoint-url "$${S3_ENDPOINT}" s3api create-bucket --bucket "$${S3_BUCKET}" >/dev/null 2>&1 \
          || aws --endpoint-url "$${S3_ENDPOINT}" s3api head-bucket --bucket "$${S3_BUCKET}" >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -ge 60 ]; then
            echo "timed out waiting for $${S3_ENDPOINT} and bucket $${S3_BUCKET}" >&2
            exit 1
          fi
          sleep 1
        done
    depends_on:
      rustfs:
        condition: service_started
    restart: "no"
    logging: *default-logging

  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    # this needs to match the database host in lemmy.hson
    # Tune your settings via
    # https://pgtune.leopard.in.ua/#/
    # You can use this technique to add them here
    # https://stackoverflow.com/a/30850095/1655478
    hostname: postgres
    command: postgres -c config_file=/etc/postgresql.conf
    ports:
      # use a different port so it doesn't conflict with potential postgres db running on the host
      - "5433:5432"
    environment:
      - POSTGRES_USER=lemmy
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=lemmy
    volumes:
      - ./volumes/postgres:/var/lib/postgresql:Z
      - ./customPostgresql.conf:/etc/postgresql.conf:Z
    restart: unless-stopped
    logging: *default-logging
