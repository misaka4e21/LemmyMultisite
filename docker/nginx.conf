worker_processes 1;
events {
    worker_connections 1024;
}

http {
    map $http_accept $lemmy_federation_request {
        default 0;
        ~*application/(activity\+json|ld\+json) 1;
    }

    map $http_x_forwarded_proto $lemmy_forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream lemmy {
        server lemmy:8536;
    }

    upstream lemmyms_frontend {
        server frontend:80;
    }

    server {
        listen 1236;
        listen 8536;
        server_name localhost;
        server_tokens off;

        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_vary on;
        client_max_body_size 20M;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lemmy_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        rewrite ^(.+)/+$ $1 permanent;

        location ^~ /api/ {
            proxy_pass http://lemmy;
        }

        # Public Lemmy protocol, discovery, and media routes.
        location ~ ^/(pictrs|feeds|nodeinfo|version|\.well-known|users|inbox|objects|activities|contexts|federation-media|collections|health|site_outbox)(/|$) {
            proxy_pass http://lemmy;
        }

        # Lemmy's c/u/m/post/comment ActivityPub objects overlap with frontend URLs.
        location ~ ^/(c|u|m|post|comment)(/|$) {
            if ($lemmy_federation_request) {
                return 418;
            }
            proxy_pass http://lemmyms_frontend;
        }

        error_page 418 = @lemmy_federation;
        location @lemmy_federation {
            proxy_pass http://lemmy;
        }

        location / {
            if ($request_method = POST) {
                return 418;
            }
            if ($lemmy_federation_request) {
                return 418;
            }
            proxy_pass http://lemmyms_frontend;
        }
    }
}
